[project]
name = "claude-telemetry"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
target-version = "py310"
line-length = 160
extend-exclude = [".scratch", ".claude", ".venv"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "B", "I", "PTH", "TID252", "PLC0414", "S110", "SIM105", "PLC0415", "PLW1514", "UP", "BLE001"]
ignore = ["E501", "B904", "B905"]
